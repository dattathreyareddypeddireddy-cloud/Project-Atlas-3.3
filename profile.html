
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Profile | Project Atlas</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background: #1e293b;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            font-weight: bold;
            margin: 0 auto 20px;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .role {
            color: #60a5fa;
            margin-bottom: 20px;
        }

        .intro {
            color: #cbd5e1;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .skills {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .skills span {
            background: #334155;
            color: #93c5fd;
            padding: 9px 14px;
            border-radius: 20px;
            font-size: 13px;
        }

        .github-link {
            display: inline-block;
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 25px;
            border-radius: 8px;
        }

        .github-link:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>
    <main class="profile-card">
        <div class="avatar">DR</div>

        <h1>Dattathreya Reddy</h1>

        <p class="role">CSE AI&ML Student & Developer</p>

        <p class="intro">
            Passionate about Artificial Intelligence, programming,
            and building useful technology projects.
            Always excited to learn new skills and solve problems.
        </p>

        <div class="skills">
            <span>Python</span>
            <span>HTML</span>
            <span>AI & Machine Learning</span>
        </div>

        <a class="github-link"
           href="https://github.com/naniPeddireddy"
           target="_blank"
           rel="noopener noreferrer">
            Visit My GitHub
        </a>
    </main>
</body>
</html>
